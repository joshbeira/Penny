  <rect width="600" height="800" rx="32" fill="#101418"/>

  <!-- Wordmark with the sound-dot, the product's single visual signature -->
  <circle cx="67" cy="77" r="7" fill="#FFB703"/>
  <text x="88" y="89" font-family="Arial, 'Helvetica Neue', system-ui, sans-serif" font-size="34" font-weight="bold" fill="#F5F7FA" letter-spacing="0.5">Penny</text>

