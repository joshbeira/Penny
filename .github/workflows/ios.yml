name: iOS
on:
  push:
    branches: [main, "codex/**"]
    paths: ["ios/**", ".github/workflows/ios.yml", "scripts/ios-*.sh"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml", "scripts/ios-*.sh"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native project
        run: |
          xcodebuild -version
          mkdir -p ios/build
          swiftformat ios/Penny ios/PennyTests ios/PennyUITests --swiftversion 5.9 --lint
          brew install xcodegen
          xcodegen --version
          xcodegen generate --spec ios/project.yml
          plutil -lint ios/Penny/Info.plist ios/Penny/PrivacyInfo.xcprivacy
      - name: Build, test and capture the app
        run: bash scripts/ios-check.sh
      - name: Preserve simulator evidence
        if: always()
        run: |
          if [ -d ios/build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path ios/build/Tests.xcresult --output-path ios/build/screenshots/attachments || true
            ditto -c -k --sequesterRsrc --keepParent ios/build/Tests.xcresult ios/build/Tests.xcresult.zip
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-verification
          path: |
            ios/build/*.log
            ios/build/screenshots/**/*.png
            ios/build/screenshots/**/manifest.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/build/*.xcresult.zip
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: |
            ios/build/Penny-simulator.zip
            ios/build/Penny-project.zip
          retention-days: 14
