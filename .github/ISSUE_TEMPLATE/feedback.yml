name: Share your experience
description: Tell me what helped, or what made Penny difficult to use.
title: "Feedback: "
body:
  - type: markdown
    attributes:
      value: "Thank you for trying Penny. This report is public. Please do not attach personal letters, names, addresses, account details or PINs."
  - type: dropdown
    id: platform
    attributes:
      label: Which Penny did you use?
      options:
        - Web app
        - Android app
        - iOS developer preview
        - More than one platform
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: Read a library letter aloud, for example.
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What worked, and what got in the way?
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Device, browser and assistive technology (optional)
  - type: dropdown
    id: completed
    attributes:
      label: Could you complete your task?
      options:
        - Yes, independently
        - Yes, with help
        - No
        - Just exploring
  - type: textarea
    id: return
    attributes:
      label: Would you use Penny again? What would make it more useful?
