name: Report a bug or accessibility barrier
description: A reproducible problem using non-sensitive example content.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "Do not include private documents or credentials. Security issues should be reported privately using SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device, browser, version and assistive technology
    validations:
      required: true
